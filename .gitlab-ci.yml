image: annepoot/probfem:latest

stages:
  - test

test:
  stage: test
  script:
    - source $(conda info --base)/etc/profile.d/conda.sh
    - conda activate probfem
    - echo "Compiling C++ code"
    - cd fem/jive/src
    - make clean-all
    - make
    - cd ../../..
    - echo "Running tests"
    - pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

